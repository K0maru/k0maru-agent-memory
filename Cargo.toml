[package]
name = "k0maru"
version = "0.2.0"
edition = "2021"
description = "Cleanroom, single-static-binary, zero-daemon agent memory hub mounting Obsidian and LLM-Wiki"

[lib]
name = "k0maru"
path = "src/lib.rs"

[[bin]]
name = "k0maru"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
rusqlite = { version = "0.31", features = ["bundled"] }
pulldown-cmark = "0.11"
walkdir = "2.5"
arboard = "3.4"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
